version: 2.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.0
  provider: ^6.1.2
  http: ^1.2.1
  mongo_dart: ^0.10.2
  intl: ^0.19.0
  fl_chart: ^0.67.0
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.3.3
  path: ^1.9.0
